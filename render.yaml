services:
  # ============================================================================
  # 1. Python AI & Computer Vision Service
  # ============================================================================
  - type: web
    name: safehome-ai-service
    runtime: python
    rootDir: python-service
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: AI_SERVICE_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"

  # ============================================================================
  # 2. Node.js Backend API & WebSocket Gateway
  # ============================================================================
  - type: web
    name: safehome-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: "npm install --include=dev && npm run build && npm run db:init"
    startCommand: "npm run start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:./safehome.sqlite
      - key: JWT_SECRET
        generateValue: true
      - key: AI_SERVICE_SECRET
        fromService:
          type: web
          name: safehome-ai-service
          envVarKey: AI_SERVICE_SECRET
      - key: PYTHON_SERVICE_URL
        fromService:
          type: web
          name: safehome-ai-service
          property: host
      - key: CORS_ORIGIN
        value: "*"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

  # ============================================================================
  # 3. Frontend React Web Application
  # ============================================================================
  - type: web
    name: safehome-frontend
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: safehome-backend
          property: host
