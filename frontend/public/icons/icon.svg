  <!-- Outer Shield Path -->
  <path d="M256 56L96 128V240C96 352 165 448 256 476C347 448 416 352 416 240V128L256 56Z" stroke="url(#shieldBorder)" stroke-width="16" stroke-linejoin="round" fill="#0f172a" fill-opacity="0.8"/>
  
  <!-- Camera Body -->
  <rect x="176" y="200" width="160" height="120" rx="24" fill="#1e293b" stroke="#38bdf8" stroke-width="8"/>
  <!-- Camera Lens Outer Ring -->
  <circle cx="256" cy="260" r="42" fill="#090d16" stroke="#0ea5e9" stroke-width="8"/>
  <!-- Camera Lens Pupil -->
  <circle cx="256" cy="260" r="20" fill="#38bdf8"/>
  <circle cx="264" cy="252" r="6" fill="#ffffff" opacity="0.8"/>
  
  <!-- Camera Flash / Sensor -->
  <circle cx="304" cy="226" r="8" fill="#38bdf8"/>
  
